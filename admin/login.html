<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - कृष्ण कोचिंग सेंटर</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-family: Arial, "Noto Sans Devanagari", sans-serif;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 8px 30px #00000018;
        }

        h1 {
            margin: 0;
            text-align: center;
            color: #1d4ed8;
        }

        h2 {
            text-align: center;
            margin: 8px 0 25px;
            color: #0f172a;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #1d4ed8;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .info {
            margin-top: 18px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>कृष्ण कोचिंग सेंटर</h1>

    <h2>Admin Login</h2>

    <form>

        <label for="email">Admin Email</label>

        <input
            type="email"
            id="email"
            placeholder="Admin Email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="info">
        केवल अधिकृत Admin के लिए
    </div>

</div>

</body>
</html>
